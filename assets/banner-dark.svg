<svg xmlns="http://www.w3.org/2000/svg" width="840" height="370" viewBox="0 0 840 370" role="img" aria-labelledby="t d">
<title id="t">Abhishek Vishwakarma · Personal Engineering Atlas</title>
<desc id="d">An original panoramic harbor: a survey ship and a hat on the quay, warm sunlight across the water, and a distant skyline beneath crimson clouds, a red moon and fine rain. One continuous world, drawn in paper, ink and gold.</desc>
<defs><style>
@keyframes shimmer{0%,100%{opacity:.55}50%{opacity:.85}}.shimmer{animation:shimmer 11s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes tide{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}.boat{animation:tide 7.1s cubic-bezier(.45,.05,.55,.95) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
