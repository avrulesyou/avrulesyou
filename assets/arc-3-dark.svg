<svg xmlns="http://www.w3.org/2000/svg" width="840" height="64" viewBox="0 0 840 64" role="img" aria-labelledby="t d">
<title id="t">ARC III — THREE-SWORD STYLE</title>
<desc id="d">Section ribbon "ARC III — THREE-SWORD STYLE" with a straw hat medallion on the left and a red cloud medallion on the right.</desc>
<defs>
<style>@keyframes shim{0%{transform:translateX(-220px)}55%,100%{transform:translateX(1060px)}}.shim{animation:shim 7s cubic-bezier(.5,0,.3,1) infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}.bob{animation:bob 3.7s cubic-bezier(.45,.05,.55,.95) infinite}.bob2{animation:bob 4.3s cubic-bezier(.45,.05,.55,.95) -1.2s infinite}@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}.tw{animation:tw 2.9s cubic-bezier(.45,.05,.55,.95) infinite}@keyframes spk{0%,100%{opacity:0;transform:scale(.3) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}70%{opacity:0;transform:scale(.4) rotate(90deg)}}.spk{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F6B800"/><stop offset=".2" stop-color="#141821"/><stop offset=".8" stop-color="#141821"/><stop offset="1" stop-color="#C1121F"/></linearGradient>
<linearGradient id="bandShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".14"/></linearGradient>
<linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B07F00"/><stop offset=".45" stop-color="#F6B800"/><stop offset=".55" stop-color="#E5383B"/><stop offset="1" stop-color="#C1121F"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".18"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="medL" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFF6D6"/><stop offset=".6" stop-color="#FFD95A"/><stop offset="1" stop-color="#F6B800"/></radialGradient>
<radialGradient id="medR" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#2A2A38"/><stop offset="1" stop-color="#0B0B10"/></radialGradient>
<linearGradient id="straw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7DC93"/><stop offset=".6" stop-color="#E9C46A"/><stop offset="1" stop-color="#B98D2E"/></linearGradient>
