<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="410" height="520" viewBox="0 0 410 520" role="img" aria-labelledby="t d"><title id="t">Most Valued Engineer: Abhishek Vishwakarma</title><desc id="d">One Piece style Most Valued Engineer poster for Abhishek Vishwakarma, for shipping perfect software in record time. Valued at 113,000,000 berries: 113 contributions in the last year times one million. 22 active days, peak day 19 contributions on Sep 28, longest streak 2 days. Engineering Atlas field edition.</desc><style>.sway{transform-origin:205px 34px;animation:sway 11s cubic-bezier(.45,.05,.55,.95) infinite;}@keyframes sway{0%,100%{transform:rotate(0deg);}50%{transform:rotate(0.2deg);}}.glow{opacity:.15}.shine{display:none}@media (prefers-reduced-motion: reduce){*{animation:none !important;}}</style><defs>
